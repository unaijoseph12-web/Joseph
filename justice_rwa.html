<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>RWANDA JUSTICE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.28.4/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --ink: #12252b; --ink-soft: #4a5c61; --ink-faint: #7c8c90;
    --teal-900: #0a3a3f; --teal-800: #0b4f55; --teal-700: #0e6169;
    --teal-100: #e4efee; --teal-050: #f4f9f8;
    --parchment: #faf8f4; --paper: #ffffff; --line: #e1e6e5;
    --amber-100: #f7ead9; --error: #b23b3b;
    --font-display: "Fraunces", Georgia, serif;
    --font-body: "Inter", ui-sans-serif, system-ui, sans-serif;
    --radius-sm: 8px; --radius-md: 14px; --radius-lg: 22px;
    --shadow-card: 0 20px 50px rgba(10,40,44,0.08);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root[data-theme="dark"] {
    --ink: #eef3f2; --ink-soft: #b9c8c7; --ink-faint: #8ba0a0;
    --parchment: #0d1a1c; --paper: #12262a; --line: #223a3d;
    --teal-050: #123033; --teal-100: #17393c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #eef3f2; --ink-soft: #b9c8c7; --ink-faint: #8ba0a0;
      --parchment: #0d1a1c; --paper: #12262a; --line: #223a3d;
      --teal-050: #123033; --teal-100: #17393c;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; font-family: var(--font-body); color: var(--ink); background: var(--parchment); -webkit-font-smoothing: antialiased; }
  h1, h2, h3 { font-family: var(--font-display); font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  p { margin: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--teal-700); outline-offset: 2px; }
  img { max-width: 100%; }
  .app-wrap { overflow-x: hidden; }

  /* Navbar */
  .navbar { height: 76px; padding: 0 7%; display: flex; align-items: center; justify-content: space-between; background: var(--paper); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-logo { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: var(--teal-800); color: white; font-size: 22px; flex-shrink: 0; }
  .brand strong { display: block; letter-spacing: 0.02em; }
  .brand small { display: block; color: var(--ink-faint); font-size: 10px; margin-top: 2px; }
  .navbar nav { display: flex; align-items: center; gap: 20px; }
  .navbar nav a { color: var(--ink-soft); font-size: 14px; }
  .navbar nav a:hover { color: var(--teal-700); }
  .navbar select { padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); }
  .ask-button, .login-button { border: 0; border-radius: 9px; padding: 10px 14px; display: flex; align-items: center; gap: 7px; }
  .ask-button { background: var(--teal-100); color: var(--teal-800); font-weight: 600; }
  .login-button { background: var(--teal-800); color: white; font-weight: 700; }
  @media (max-width: 900px) { .navbar nav a { display: none; } }
  @media (max-width: 600px) { .navbar { padding: 0 5%; } .navbar nav select, .ask-button { display: none; } }

  /* Hero */
  .hero { padding: 90px 8%; display: grid; grid-template-columns: 1.2fr .8fr; gap: 70px; align-items: center; background: linear-gradient(135deg, var(--teal-050) 0%, var(--parchment) 75%); }
  .badge { display: inline-block; padding: 9px 14px; border-radius: 30px; background: var(--teal-100); color: var(--teal-800); font-size: 13px; font-weight: 700; }
  .hero h1 { font-size: clamp(38px, 5.6vw, 66px); line-height: 1.04; margin: 22px 0; }
  .hero h1 span { color: var(--teal-700); }
  .hero-content > p { max-width: 640px; font-size: 18px; line-height: 1.7; color: var(--ink-soft); }
  .hero-actions { display: flex; gap: 12px; margin: 30px 0; flex-wrap: wrap; }
  .primary-button, .secondary-button { border: 0; border-radius: 10px; padding: 14px 18px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; }
  .primary-button { background: var(--teal-800); color: white; }
  .primary-button:hover { background: var(--teal-900); }
  .secondary-button { background: var(--teal-100); color: var(--teal-800); }
  .full { width: 100%; }
  .trust-row { display: flex; gap: 22px; color: var(--ink-faint); font-size: 12px; flex-wrap: wrap; }
  .trust-row span { display: flex; gap: 6px; align-items: center; }
  .tracker-card { padding: 30px; border-radius: var(--radius-lg); background: var(--paper); border: 1px solid var(--line); box-shadow: var(--shadow-card); }
  .tracker-header { display: flex; justify-content: space-between; color: var(--ink-faint); font-size: 12px; font-weight: 700; letter-spacing: 0.06em; }
  .tracker-card h2 { margin: 25px 0 8px; font-size: 26px; }
  .tracker-card p { color: var(--ink-soft); line-height: 1.5; }
  .tracker-card input { width: 100%; padding: 14px; border: 1px solid var(--line); border-radius: 10px; margin: 8px 0 12px; outline: none; background: var(--paper); }
  .tracker-card input:focus { border-color: var(--teal-700); }
  .tracker-message { margin-top: 12px; font-size: 13px; color: var(--teal-800); }
  .tracker-message.error { color: var(--error); }
  .demo-note { display: block; margin-top: 13px; color: var(--ink-faint); font-size: 10px; }
  @media (max-width: 900px) { .hero { grid-template-columns: 1fr; } }
  @media (max-width: 600px) { .hero { padding: 55px 6%; } .trust-row { flex-direction: column; gap: 8px; } }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(4,1fr); border-bottom: 1px solid var(--line); }
  .stats div { padding: 28px; text-align: center; border-right: 1px solid var(--line); }
  .stats div:last-child { border-right: 0; }
  .stats strong { display: block; color: var(--teal-800); font-size: 26px; font-family: var(--font-display); }
  .stats span { color: var(--ink-faint); font-size: 12px; }
  @media (max-width: 600px) { .stats { grid-template-columns: 1fr; } .stats div { border-right: 0; border-bottom: 1px solid var(--line); } }

  /* Sections generic */
  .section { padding: 90px 8%; }
  .section.grey { background: var(--teal-050); }
  .section-label { color: var(--teal-700); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
  .section h2 { font-size: 36px; margin: 12px 0; }
  .section-description { color: var(--ink-soft); }
  @media (max-width: 600px) { .section { padding: 60px 6%; } }

  /* Services */
  .service-grid { margin-top: 38px; display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; }
  .service-card { border: 1px solid var(--line); background: var(--paper); border-radius: var(--radius-md); padding: 22px; text-align: left; display: grid; grid-template-columns: auto 1fr auto; gap: 15px; align-items: center; transition: .2s; color: var(--ink); }
  .service-card:hover { box-shadow: var(--shadow-card); transform: translateY(-2px); }
  .service-icon { width: 48px; height: 48px; border-radius: 13px; display: grid; place-items: center; background: var(--teal-050); color: var(--teal-700); font-size: 24px; }
  .service-content h3 { margin: 0 0 6px; font-size: 17px; }
  .service-content p { margin: 0; color: var(--ink-faint); font-size: 13px; line-height: 1.5; }
  @media (max-width: 900px) { .service-grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 600px) { .service-grid { grid-template-columns: 1fr; } }

  /* Steps */
  .steps { margin-top: 45px; display: grid; grid-template-columns: repeat(4,1fr); gap: 25px; }
  .step { border-top: 2px solid var(--teal-100); padding-top: 18px; }
  .step strong { color: var(--teal-700); font-family: var(--font-display); }
  .step h3 { margin: 6px 0; font-size: 16px; }
  .step p { color: var(--ink-soft); font-size: 14px; line-height: 1.5; }
  @media (max-width: 900px) { .steps { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 600px) { .steps { grid-template-columns: 1fr; } }

  /* Jobs */
  .jobs-section { padding: 75px 8%; display: grid; grid-template-columns: 1fr .7fr; gap: 60px; align-items: center; background: var(--teal-900); color: white; }
  .jobs-section h2 { font-size: 34px; margin: 12px 0 18px; }
  .jobs-section .light { color: #8fc4bf; }
  .jobs-section p { color: #c3d9d7; line-height: 1.6; max-width: 460px; }
  .jobs-section .secondary-button { margin-top: 24px; border: 0; }
  .job-card { background: var(--paper); color: var(--ink); padding: 30px; border-radius: var(--radius-lg); }
  .job-card-icon { font-size: 32px; }
  .job-card h3 { margin: 10px 0 4px; }
  .job-card p { color: var(--ink-faint); font-size: 13px; }
  .job-progress { display: flex; gap: 8px; margin-top: 20px; }
  .job-progress span { height: 9px; flex: 1; border-radius: 20px; background: var(--teal-100); }
  .job-progress span:first-child { background: var(--teal-700); }
  .job-links-wrap { grid-column: 1 / -1; margin-top: 4px; }
  .job-links-heading { color: white; font-size: 21px; margin: 0 0 8px; }
  .job-links-note { color: #c3d9d7; margin: 0 0 18px; font-size: 13px; }
  .job-links-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .job-link-card { display: block; text-decoration: none; background: #fff; color: var(--ink); padding: 18px; border-radius: 14px; border: 1px solid rgba(255,255,255,.2); transition: transform .15s ease, box-shadow .15s ease; }
  .job-link-card:hover, .job-link-card:focus-visible { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.16); outline: 2px solid #8fc4bf; }
  .job-link-card strong { display: block; margin-bottom: 7px; }
  .job-link-card span { display: block; font-size: 13px; line-height: 1.45; color: var(--ink-soft); }
  .job-link-card em { display: inline-block; margin-top: 12px; font-size: 12px; color: var(--teal-700); font-style: normal; font-weight: 700; }
  @media (max-width: 900px) { .jobs-section { grid-template-columns: 1fr; } .job-links-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 600px) { .jobs-section { padding: 60px 6%; } .job-links-grid { grid-template-columns: 1fr; } }

  /* Ask Unai banner + modal */
  .unai-section { margin: 75px 8%; padding: 35px; border-radius: var(--radius-lg); background: var(--teal-050); display: flex; gap: 25px; align-items: center; flex-wrap: wrap; }
  .unai-section > div:nth-child(2) { flex: 1; min-width: 220px; }
  .unai-icon { width: 58px; height: 58px; display: grid; place-items: center; border-radius: 15px; background: var(--teal-800); color: white; font-size: 28px; }
  .unai-section h2 { font-size: 24px; margin: 6px 0; }
  .unai-section p { color: var(--ink-soft); line-height: 1.5; }
  .unai-section .primary-button { white-space: nowrap; }
  @media (max-width: 600px) { .unai-section { margin: 45px 6%; flex-direction: column; align-items: flex-start; } }

  .modal-background { position: fixed; inset: 0; z-index: 100; background: rgba(5,23,27,.75); display: grid; place-items: center; padding: 20px; }
  .unai-modal { position: relative; width: min(580px,100%); padding: 35px; border-radius: var(--radius-lg); background: var(--paper); box-shadow: 0 30px 100px rgba(0,0,0,.3); max-height: 90vh; overflow-y: auto; }
  .modal-close { position: absolute; top: 16px; right: 16px; width: 35px; height: 35px; border: 0; border-radius: 50%; background: var(--teal-050); font-size: 22px; }
  .chat-message { margin: 12px 0; padding: 13px 15px; border-radius: 13px; background: var(--teal-050); color: var(--ink-soft); line-height: 1.5; max-width: 88%; }
  .chat-message.user { background: var(--teal-800); color: white; margin-left: auto; }
  .chat-thread { max-height: 360px; overflow-y: auto; padding-right: 4px; }
  .chat-input-row { display: flex; gap: 8px; margin-top: 4px; }
  .chat-input-row input { flex: 1; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); }
  .chat-input-row input:focus { border-color: var(--teal-700); outline: none; }
  .chat-input-row button { white-space: nowrap; }
  .chat-options { display: grid; gap: 9px; }
  .chat-options button { padding: 12px; text-align: left; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); }
  .chat-options button:hover { background: var(--teal-050); }
  .unai-modal small { display: block; margin-top: 16px; color: var(--ink-faint); line-height: 1.5; }

  /* Footer */
  footer { padding: 55px 8%; display: grid; grid-template-columns: 2fr 1fr 1fr 1.2fr; gap: 45px; background: var(--teal-900); color: white; }
  footer .brand-logo { background: rgba(255,255,255,0.12); }
  footer .brand small { color: #9db8b6; }
  footer p, footer a { color: #9fb4b3; font-size: 12px; line-height: 1.7; }
  footer a { display: block; margin: 7px 0; }
  footer a:hover { color: white; }
  footer h4 { margin: 0 0 6px; font-family: var(--font-body); font-size: 14px; }
  .copyright { padding: 16px 7%; text-align: center; background: #082024; color: #6f8a89; font-size: 10px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  @media (max-width: 900px) { footer { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 600px) { footer { grid-template-columns: 1fr; padding: 45px 6%; } }

  /* Wizard */
  .wizard-page { padding: 60px 6% 90px; max-width: 760px; margin: 0 auto; }
  .wizard-card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 40px; box-shadow: var(--shadow-card); }
  .wizard-card h2 { font-size: 26px; margin-bottom: 8px; }
  .step-intro { color: var(--ink-soft); line-height: 1.6; margin-bottom: 26px; }
  .draft-banner { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 14px 16px; margin-bottom: 26px; background: var(--amber-100); border: 1px solid #e3c393; border-radius: 10px; font-size: 13px; color: var(--ink); }
  .draft-banner div { display: flex; gap: 8px; flex-shrink: 0; }
  .draft-banner button { border: 0; border-radius: 8px; padding: 8px 12px; font-size: 12px; font-weight: 700; }
  .draft-banner button:first-child { background: var(--teal-800); color: white; }
  .draft-banner button:last-child { background: transparent; color: var(--ink-soft); }
  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .field input, .field select, textarea { width: 100%; padding: 13px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); font-family: var(--font-body); }
  .field input:focus, .field select:focus, textarea:focus { border-color: var(--teal-700); outline: none; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .field-error { display: block; margin-top: 6px; font-size: 12px; color: var(--error); }
  .wizard-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 34px; padding-top: 24px; border-top: 1px solid var(--line); }
  .btn-primary, .btn-secondary { border: 0; border-radius: 10px; padding: 13px 20px; font-weight: 700; }
  .btn-primary { background: var(--teal-800); color: white; }
  .btn-primary:hover { background: var(--teal-900); }
  .btn-secondary { background: var(--teal-050); color: var(--teal-800); }
  @media (max-width: 640px) { .wizard-card { padding: 26px 20px; } .field-row { grid-template-columns: 1fr; } }

  .service-options { display: grid; gap: 10px; margin-top: 20px; }
  .service-option { display: flex; gap: 14px; align-items: flex-start; text-align: left; padding: 16px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--paper); width: 100%; }
  .service-option:hover { border-color: var(--teal-700); }
  .service-option.selected { border-color: var(--teal-700); background: var(--teal-050); }
  .service-option .icon { font-size: 22px; }
  .service-option strong { display: block; margin-bottom: 4px; }
  .service-option p { margin: 0; color: var(--ink-faint); font-size: 13px; line-height: 1.4; }

  textarea { resize: vertical; }
  .char-count { text-align: right; font-size: 11px; color: var(--ink-faint); margin-top: 6px; }

  .dropzone { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 34px; border: 2px dashed var(--line); border-radius: var(--radius-md); text-align: center; cursor: pointer; background: var(--teal-050); }
  .dropzone:hover { border-color: var(--teal-700); }
  .dropzone input { display: none; }
  .dropzone-icon { font-size: 26px; }
  .dropzone small { color: var(--ink-faint); }
  .file-list { list-style: none; padding: 0; margin: 18px 0 0; display: grid; gap: 8px; }
  .file-list li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); }
  .file-name { flex: 1; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-size { color: var(--ink-faint); font-size: 12px; }
  .file-list button { border: 0; background: none; font-size: 18px; color: var(--ink-faint); line-height: 1; padding: 4px; }
  .file-list button:hover { color: var(--error); }

  .review-list { display: grid; gap: 2px; border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; }
  .review-row { display: grid; grid-template-columns: 140px 1fr auto; gap: 12px; align-items: start; padding: 14px 16px; background: var(--paper); border-bottom: 1px solid var(--line); }
  .review-row:last-child { border-bottom: 0; }
  .review-row dt { color: var(--ink-faint); font-size: 13px; margin: 0; }
  .review-row dd { margin: 0; font-size: 14px; }
  .review-row.long dd { white-space: pre-wrap; }
  .review-row button { border: 0; background: none; color: var(--teal-700); font-weight: 600; font-size: 13px; }
  .review-row button:hover { text-decoration: underline; }
  @media (max-width: 560px) { .review-row { grid-template-columns: 1fr auto; } .review-row dt { grid-column: 1 / -1; } }

  .confirmation { text-align: center; max-width: 480px; margin: 0 auto; padding: 20px 0 10px; }
  .confirmation-icon { width: 60px; height: 60px; margin: 0 auto 20px; border-radius: 50%; background: var(--teal-100); color: var(--teal-800); font-size: 28px; display: grid; place-items: center; }
  .confirmation h2 { font-size: 26px; margin-bottom: 10px; }
  .confirmation p { color: var(--ink-soft); line-height: 1.6; }
  .reference-box { margin: 24px auto; padding: 16px; border: 1px dashed var(--teal-700); border-radius: 10px; font-family: var(--font-display); font-size: 20px; letter-spacing: 0.02em; color: var(--teal-800); background: var(--teal-050); }
  .confirmation-note { font-size: 12px; color: var(--ink-faint); }
  .confirmation-actions { margin-top: 26px; }
  .confirmation-actions .primary-button { display: inline-block; }

  /* Wizard progress */
  .wizard-progress { list-style: none; display: flex; gap: 4px; padding: 0; margin: 0 0 40px; }
  .wizard-progress li { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; position: relative; }
  .wizard-progress li:not(:last-child)::after { content: ''; position: absolute; top: 15px; left: 55%; width: 90%; height: 2px; background: var(--line); z-index: 0; }
  .wizard-progress li.done:not(:last-child)::after { background: var(--teal-700); }
  .wp-dot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--paper); border: 2px solid var(--line); color: var(--ink-faint); font-size: 13px; font-weight: 700; position: relative; z-index: 1; }
  li.current .wp-dot { border-color: var(--teal-700); color: var(--teal-700); }
  li.done .wp-dot { background: var(--teal-700); border-color: var(--teal-700); color: white; }
  .wp-label { font-size: 11px; color: var(--ink-faint); max-width: 80px; }
  li.current .wp-label { color: var(--teal-800); font-weight: 600; }
  @media (max-width: 640px) { .wp-label { display: none; } }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* Revenue dashboard */
  .dash-page { padding: 60px 8% 90px; max-width: 1000px; margin: 0 auto; }
  .dash-header { margin-bottom: 34px; max-width: 640px; }
  .dash-header-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .signout-button { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 7px 12px; font-size: 12px; color: var(--ink-soft); }
  .signout-button:hover { color: var(--error); border-color: var(--error); }
  .login-card { max-width: 420px; margin: 0 auto; }
  .cases-table-wrap { overflow-x: auto; }

async function askUnai(messages) {
  const res = await fetch(ASK_UNAI_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages }),
  });
  const data = await res.json();

  return data.reply;
}

async function saveCase(record) {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) throw new Error('You need to be signed in to submit a case.');
  const { data, error } = await sb.from('cases').insert({ ...record, user_id: user.id }).select().single();
  if (error) throw error;
  return data;
}

async function getCaseByReference(reference) {
  const { data, error } = await sb.rpc('get_case_by_reference', { p_reference: reference.trim() });
  if (error) throw error;
  return data && data.length > 0 ? data[0] : null;
}

async function fetchProfile(userId) {

  if (error) throw error;
  return data;

function generateReference() {

// Draft autosave stays on localStorage — it's just a convenience so an
// in-progress form survives a refresh, not data anyone else needs to see.
const DRAFT_KEY = 'rwandaJustice.draft.v1';
function readJSON(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch { return fallback; }
}
function writeJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch { return false; }
}
function saveDraft(step, data) {
  const { documents, ...rest } = data;
  writeJSON(DRAFT_KEY, { step, data: rest, savedAt: new Date().toISOString() });
}
function readDraft() { return readJSON(DRAFT_KEY, null); }
function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch {} }

function formatDate(iso) {
  return new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
}
function formatSize(bytes) {
  if (bytes < 1024 * 1024) return `${Math.round(bytes / 1024)} KB`;
  return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
}

function AskUnaiModal({ open, onClose }) {
  const [messages, setMessages] = useState([
    { role: 'assistant', content: 'Muraho! I\'m Unai. Ask me anything about justice services on this platform, or about your situation in general — I\'ll give you a straight answer.' },
  ]);
  const [input, setInput] = useState('');
  const [sending, setSending] = useState(false);
  const [error, setError] = useState('');
  const scrollRef = useRef(null);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, sending]);

  if (!open) return null;

  async function handleSend(e) {
    e.preventDefault();
    const text = input.trim();
    if (!text || sending) return;
    const nextMessages = [...messages, { role: 'user', content: text }];
    setMessages(nextMessages);
    setInput('');
    setError('');
    setSending(true);
    try {
      const reply = await askUnai(nextMessages);
      setMessages((m) => [...m, { role: 'assistant', content: reply }]);
    } catch (err) {
      setError(err.message || 'Something went wrong. Please try again.');
    } finally {
      setSending(false);
    }
  }

  return (
    <div className="modal-background" onClick={onClose}>
      <div className="unai-modal" onClick={(e) => e.stopPropagation()}>

    </div>
  );

const STEP_LABELS = ['Your details', 'Service', 'Location', 'Description', 'Documents', 'Review'];
const TOTAL_STEPS = 6;
const MIN_DESC_LENGTH = 30;

const initialWizardState = {
  fullName: '', phone: '', email: '', nationalId: '',
  service: '', province: '', district: '', sector: '',
  description: '', documents: [],
};

function wizardReducer(state, action) {
  if (action.type === 'update') return { ...state, [action.field]: action.value };
  return state;
}

function validateStep(step, data) {
  const errors = {};
  if (step === 1) {
    if (!data.fullName.trim()) errors.fullName = 'Enter your full name.';
    if (!data.phone.trim()) errors.phone = 'Enter a phone number so we can reach you.';
    if (!data.nationalId.trim() || data.nationalId.replace(/\D/g, '').length < 16) errors.nationalId = 'Enter a valid 16-digit national ID number.';
  }
  if (step === 2) { if (!data.service) errors.service = 'Select a service to continue.'; }
  if (step === 3) {
    if (!data.province) errors.province = 'Select a province.';
    if (!data.district) errors.district = 'Select a district.';
    if (!data.sector.trim()) errors.sector = 'Enter a sector.';
  }
  if (step === 4) { if (data.description.trim().length < MIN_DESC_LENGTH) errors.description = `Add a bit more detail (at least ${MIN_DESC_LENGTH} characters).`; }
  return errors;
}

function WizardProgress({ step }) {
  return (
    <ol className="wizard-progress" aria-label="Case submission progress">
      {STEP_LABELS.map((label, i) => {
        const n = i + 1;
        const state = n < step ? 'done' : n === step ? 'current' : 'upcoming';
        return (
          <li key={label} className={state}>
            <span className="wp-dot">{n < step ? '✓' : n}</span>
            <span className="wp-label">{label}</span>
          </li>
        );
      })}
    </ol>
  );
}

function StepDetails({ data, errors, onChange }) {

const MAX_FILE_MB = 10;

function StepDocuments({ data, errors, onChange }) {
  function handleFiles(e) {
    const incoming = Array.from(e.target.files || []);
    const tooLarge = incoming.filter((f) => f.size > MAX_FILE_MB * 1024 * 1024);
    const accepted = incoming.filter((f) => f.size <= MAX_FILE_MB * 1024 * 1024);
    if (tooLarge.length) alert(`${tooLarge.map((f) => f.name).join(', ')} exceeds the ${MAX_FILE_MB} MB limit and was not added.`);
    onChange('documents', [...data.documents, ...accepted]);
    e.target.value = '';
  }
  function removeFile(index) { onChange('documents', data.documents.filter((_, i) => i !== index)); }
  return (
    <div>
      <h2>Upload supporting documents</h2>
      <p className="step-intro">ID copies, contracts, photos, or anything else relevant. This step is optional — you can also submit and add documents later.</p>
      <label className="dropzone">
        <input type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" onChange={handleFiles} />
        <span className="dropzone-icon">📎</span>
        <span><strong>Click to upload</strong> or drag files here</span>
        <small>PDF, JPG, PNG, DOC — up to {MAX_FILE_MB} MB each</small>
      </label>
      {data.documents.length > 0 && (
        <ul className="file-list">
          {data.documents.map((f, i) => (
            <li key={`${f.name}-${i}`}>
              <span className="file-icon">📄</span>
              <span className="file-name">{f.name}</span>
              <span className="file-size">{formatSize(f.size)}</span>
              <button type="button" onClick={() => removeFile(i)} aria-label={`Remove ${f.name}`}>×</button>
            </li>
          ))}
        </ul>
      )}
      {errors.documents && <span className="field-error">{errors.documents}</span>}
    </div>
  );
}

function SubmitCase({ onNavigate }) {
  const [data, dispatch] = useReducer(wizardReducer, initialWizardState);
  const [step, setStep] = useState(1);
  const [errors, setErrors] = useState({});
  const [reference, setReference] = useState(null);
  const [submitting, setSubmitting] = useState(false);
  const [submitError, setSubmitError] = useState('');
  const [draft] = useState(() => readDraft());
  const [draftDismissed, setDraftDismissed] = useState(false);
  const skipNextAutosave = useRef(true);

  useEffect(() => {
    if (skipNextAutosave.current) { skipNextAutosave.current = false; return; }
    saveDraft(step, data);
  }, [step, data]);

  function onChange(field, value) {
    dispatch({ type: 'update', field, value });
    if (errors[field]) setErrors((e) => ({ ...e, [field]: undefined }));
  }
  function resumeDraft() {
    Object.entries(draft.data).forEach(([field, value]) => dispatch({ type: 'update', field, value }));
    setStep(draft.step);
    setDraftDismissed(true);
  }
  function discardDraft() { clearDraft(); setDraftDismissed(true); }
  function goNext() {
    const stepErrors = validateStep(step, data);
    if (Object.keys(stepErrors).length) { setErrors(stepErrors); return; }
    setErrors({});
    setStep((s) => Math.min(s + 1, TOTAL_STEPS));
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function goBack() { setStep((s) => Math.max(s - 1, 1)); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  function goToStep(n) { setStep(n); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  async function submit() {
    setSubmitting(true);
    setSubmitError('');
    const ref = generateReference();
    try {
      await saveCase({
        reference: ref,
        full_name: data.fullName,
        phone: data.phone,
        email: data.email || null,
        national_id: data.nationalId,
        service: data.service,
        province: data.province,
        district: data.district,
        sector: data.sector,
        description: data.description,
        documents: data.documents.map((f) => ({ name: f.name, size: f.size })),
        status: 'Under Review',
      });
      clearDraft();
      setReference(ref);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (err) {
      setSubmitError(err.message || 'Something went wrong submitting your case. Please try again.');
    } finally {
      setSubmitting(false);
    }
  }

  if (reference) {
    return <main className="wizard-page"><div className="wizard-card"><StepConfirmation reference={reference} onNavigate={onNavigate} /></div></main>;
  }

  const showDraftBanner = draft && !draftDismissed;

  return (
    <main className="wizard-page">
      <div className="wizard-card">
        {showDraftBanner && (
          <div className="draft-banner">
            <span>You have a saved draft from earlier. Resume where you left off?</span>
            <div>
              <button type="button" onClick={resumeDraft}>Resume draft</button>
              <button type="button" onClick={discardDraft}>Start over</button>
            </div>
          </div>
        )}
        <WizardProgress step={step} />
        {step === 1 && <StepDetails data={data} errors={errors} onChange={onChange} />}
        {step === 2 && <StepService data={data} errors={errors} onChange={onChange} />}
        {step === 3 && <StepLocation data={data} errors={errors} onChange={onChange} />}
        {step === 4 && <StepDescription data={data} errors={errors} onChange={onChange} />}
        {step === 5 && <StepDocuments data={data} errors={errors} onChange={onChange} />}
        {step === 6 && <StepReview data={data} onEdit={goToStep} />}
        <div className="wizard-actions">
          {step > 1 ? <button type="button" className="btn-secondary" onClick={goBack}>← Back</button> : <span />}
          {step < TOTAL_STEPS
            ? <button type="button" className="btn-primary" onClick={goNext}>Continue →</button>
            : <button type="button" className="btn-primary" onClick={submit}>Submit case</button>}
        </div>
      </div>
    </main>
  );
}

function AuthForm({ notice: initialNotice }) {
  const [mode, setMode] = useState('signin'); // signin | signup | verify
  const [method, setMethod] = useState('email'); // email OTP or SMS OTP
  const [pendingMethod, setPendingMethod] = useState('email');
  const [pendingContact, setPendingContact] = useState('');
  const [fullName, setFullName] = useState('');
  const [phone, setPhone] = useState('');
  const [email, setEmail] = useState('');
  const [identifier, setIdentifier] = useState('');
  const [password, setPassword] = useState('');
  const [otp, setOtp] = useState('');
  const [error, setError] = useState('');
  const [notice, setNotice] = useState(initialNotice || '');
  const [loading, setLoading] = useState(false);

  function normalizePhoneNumber(value) {
    const compact = String(value || '').trim().replace(/[()\s.-]/g, '');
    const digits = compact.replace(/\D/g, '');
    if (!digits) return '';
    if (compact.startsWith('+')) return '+' + digits;
    if (digits.startsWith('00')) return '+' + digits.slice(2);
    if (digits.startsWith('250')) return '+' + digits;
    if (digits.startsWith('0')) return '+250' + digits.slice(1);
    return '+' + digits;
  }

  async function handleSubmit(e) {
    e.preventDefault();
    setLoading(true);
    setError('');
    setNotice('');
    try {
      if (mode === 'verify') {
        const cleanCode = otp.trim();
        if (!/^\d{6}$/.test(cleanCode)) {
          throw new Error('Enter the 6-digit verification code you received.');
        }
        const result = pendingMethod === 'phone'
          ? await sb.auth.verifyOtp({ phone: pendingContact, token: cleanCode, type: 'sms' })
          : await sb.auth.verifyOtp({ email: pendingContact, token: cleanCode, type: 'email' });
        if (result.error) throw result.error;
        setNotice(pendingMethod === 'phone'
          ? 'Your phone number has been verified.'
          : 'Your email address has been verified.');
        setOtp('');
        return;
      }

      if (mode === 'signin') {
        const contact = identifier.trim();
        if (!contact) throw new Error('Enter your email address or phone number.');
        const credentials = contact.includes('@')
          ? { email: contact.toLowerCase(), password }
          : { phone: normalizePhoneNumber(contact), password };
        const { error: signInError } = await sb.auth.signInWithPassword(credentials);
        if (signInError) throw signInError;
        return;
      }

      const normalizedPhone = normalizePhoneNumber(phone);
      const chosenEmail = email.trim().toLowerCase();
      if (!fullName.trim()) throw new Error('Enter your full name.');
      if (method === 'email' && !chosenEmail) throw new Error('Enter the email address where you want to receive the code.');
      if (method === 'phone' && !/^\+\d{8,15}$/.test(normalizedPhone)) {
        throw new Error('Enter a valid phone number with country code, for example +25078XXXXXXX.');
      }

      const chosenContact = method === 'email' ? chosenEmail : normalizedPhone;
      const options = {
        data: { full_name: fullName.trim(), phone: normalizedPhone || null, email: chosenEmail || null }
      };
      let signup;
      if (method === 'email') {
        signup = await sb.auth.signUp({
          email: chosenEmail,
          password,
          options: {
            ...options,
            emailRedirectTo: window.location.href.split('?')[0],
          },
        });
      } else {
        signup = await sb.auth.signUp({
          phone: normalizedPhone,
          password,
          options,
        });
      }
      if (signup.error) throw signup.error;

      if (signup.data && signup.data.session) {
        await sb.auth.signOut();
        throw new Error(method === 'email'
          ? 'Supabase returned a session without requiring email confirmation. Enable Confirm email in Supabase before using verified email signup.'
          : 'Supabase returned a session without requiring phone confirmation. Enable phone confirmation in Supabase and configure an SMS provider first.');
      }

      setPendingMethod(method);
      setPendingContact(chosenContact);
      setOtp('');
      setMode('verify');
      setNotice(method === 'email'
        ? 'We requested an email verification code for ' + chosenContact + '. Check your inbox and spam folder.'
        : 'We requested an SMS verification code for ' + chosenContact + '. Check your text messages.');
    } catch (err) {
      setError(err?.message || 'Something went wrong. Please try again.');
    } finally {
      setLoading(false);
    }
  }

  async function resendCode() {
    setLoading(true);
    setError('');
    setNotice('');
    try {
      const result = pendingMethod === 'phone'
        ? await sb.auth.resend({ type: 'sms', phone: pendingContact })
        : await sb.auth.resend({
            type: 'signup',
            email: pendingContact,
            options: { emailRedirectTo: window.location.href.split('?')[0] },
          });
      if (result.error) throw result.error;
      setNotice(pendingMethod === 'phone'
        ? 'A new SMS verification code has been requested for ' + pendingContact + '.'
        : 'A new email verification code has been requested for ' + pendingContact + '.');
    } catch (err) {
      setError(err?.message || 'Unable to resend the code right now. Please wait and try again.');
    } finally {
      setLoading(false);
    }
  }

  const isVerifying = mode === 'verify';
  const isSigningUp = mode === 'signup';

  return (
    <main className="wizard-page">
      <form className="wizard-card login-card" onSubmit={handleSubmit}>
        <div className="section-label">
          {isVerifying ? (pendingMethod === 'phone' ? 'VERIFY YOUR PHONE' : 'VERIFY YOUR EMAIL') : isSigningUp ? 'CREATE AN ACCOUNT' : 'SIGN IN'}
        </div>
        <h2>{isVerifying ? (pendingMethod === 'phone' ? 'Enter your SMS code' : 'Enter your email verification code') : isSigningUp ? 'Create your account' : 'Welcome back'}</h2>
        <p className="step-intro">
          {isVerifying
            ? 'Enter the 6-digit code sent to ' + pendingContact + '. Do not share this code with anyone.'
            : isSigningUp
              ? 'Create an account to submit and track your cases. Choose whether to receive your verification code by email or SMS.'
              : 'Sign in to submit or track a case, or view the owner dashboard if your account has admin access.'}
        </p>

        {notice && <p className="tracker-message" role="status" style={{ marginBottom: 16 }}>{notice}</p>}

        {isVerifying ? (
          <>
            <div className="field">
              <label htmlFor="auth-code">{pendingMethod === 'phone' ? 'SMS verification code' : 'Email verification code'}</label>
              <input id="auth-code" type="text" inputMode="numeric" autoComplete="one-time-code" pattern="[0-9]{6}" maxLength={6} value={otp} onChange={(e) => setOtp(e.target.value.replace(/\D/g, '').slice(0, 6))} placeholder="Enter 6-digit code" required autoFocus />
            </div>
            {error && <span className="field-error" role="alert">{error}</span>}
            <div className="wizard-actions">
              <button type="button" className="btn-secondary" disabled={loading} onClick={() => { setMode('signup'); setOtp(''); setError(''); setNotice(''); }}>Change details</button>
              <button type="submit" className="btn-primary" disabled={loading}>{loading ? 'Checking…' : 'Verify code →'}</button>
            </div>
            <button type="button" className="btn-secondary" style={{ width: '100%', marginTop: 10 }} disabled={loading} onClick={resendCode}>{loading ? 'Please wait…' : pendingMethod === 'phone' ? 'Resend SMS code' : 'Resend email code'}</button>
          </>
        ) : (
          <>
            {isSigningUp && (
              <>
                <div className="field">
                  <label htmlFor="auth-name">Full name</label>
                  <input id="auth-name" value={fullName} onChange={(e) => setFullName(e.target.value)} autoComplete="name" required />
                </div>
                <div className="field">
                  <label htmlFor="auth-method">Receive verification code by</label>
                  <select id="auth-method" value={method} onChange={(e) => { setMethod(e.target.value); setError(''); }} >
                    <option value="email">Email code</option>
                    <option value="phone">SMS text message</option>
                  </select>
                  {method === 'email'
                    ? <p className="step-intro" style={{ marginTop: 6 }}>Email code delivery requires the Supabase Confirm sign-up email template to be configured for numeric codes and working email delivery (custom SMTP for public users).</p>
                    : <p className="step-intro" style={{ marginTop: 6 }}>SMS code delivery requires phone confirmation enabled and an SMS provider configured in Supabase.</p>}
                </div>
                <div className="field">
                  <label htmlFor="auth-email">Email address{method === 'phone' ? ' (optional)' : ''}</label>
                  <input id="auth-email" type="email" autoComplete="email" value={email} onChange={(e) => setEmail(e.target.value)} required={method === 'email'} placeholder="you@example.com" />
                </div>
                <div className="field">
                  <label htmlFor="auth-phone">Phone number{method === 'phone' ? '' : ' (optional)'}</label>
                  <input id="auth-phone" type="tel" inputMode="tel" autoComplete="tel" value={phone} onChange={(e) => setPhone(e.target.value)} required={method === 'phone'} placeholder="078XXXXXXX or +25078XXXXXXX" />
                </div>
              </>
            )}

            {!isSigningUp && (
              <div className="field">
                <label htmlFor="auth-identifier">Email or phone number</label>
                <input id="auth-identifier" type="text" inputMode="email" autoComplete="username" value={identifier} onChange={(e) => setIdentifier(e.target.value)} placeholder="you@example.com or +25078XXXXXXX" required autoFocus />
              </div>
            )}
            <div className="field">
              <label htmlFor="auth-password">Password</label>
              <input id="auth-password" type="password" autoComplete={isSigningUp ? 'new-password' : 'current-password'} value={password} onChange={(e) => setPassword(e.target.value)} minLength={isSigningUp ? 8 : undefined} required />
            </div>
            {error && <span className="field-error" role="alert">{error}</span>}

            <div className="wizard-actions">
              <button type="button" className="btn-secondary" onClick={() => { setMode(isSigningUp ? 'signin' : 'signup'); setError(''); setNotice(''); }}>
                {isSigningUp ? 'Have an account? Sign in' : 'Create an account'}
              </button>
              <button type="submit" className="btn-primary" disabled={loading}>
                {loading ? 'Please wait…' : isSigningUp ? 'Send verification code →' : 'Sign in →'}
              </button>
            </div>
          </>
        )}
      </form>
    </main>
  );
}
function AuthGate({ session, profile, requireAdmin, children }) {
  if (session === undefined) return null; // still checking
  if (session === null) return <AuthForm />;
  if (requireAdmin && (!profile || profile.role !== 'admin')) {
    return (
      <main className="wizard-page">
        <div className="wizard-card login-card" style={{ textAlign: 'center' }}>
          <div className="section-label">OWNER DASHBOARD</div>
          <h2>Admins only</h2>
          <p className="step-intro">This account doesn't have admin access. Signed in as {session.user.email || session.user.phone}.</p>
        </div>
      </main>
    );
  }
  return children;
}

  const max = Math.max(...data.map((d) => d.value));
  const min = 0;
  const innerW = width - padL - padR, innerH = height - padT - padB;
  const x = (i) => padL + (i / (data.length - 1)) * innerW;
  const y = (v) => padT + innerH - ((v - min) / (max - min)) * innerH;

  const linePoints = data.map((d, i) => `${x(i)},${y(d.value)}`).join(' ');
  const areaPoints = `${padL},${padT + innerH} ${linePoints} ${padL + innerW},${padT + innerH}`;

  const gridLines = [0, 0.25, 0.5, 0.75, 1].map((f) => padT + innerH * (1 - f));

  return (
    <svg viewBox={`0 0 ${width} ${height}`} className="chart-svg" role="img" aria-label="Monthly revenue trend, increasing over the year">
      <defs>
        <linearGradient id="revFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="var(--teal-700)" stopOpacity="0.28" />
          <stop offset="100%" stopColor="var(--teal-700)" stopOpacity="0" />
        </linearGradient>
      </defs>
      {gridLines.map((gy, i) => <line key={i} x1={padL} x2={width - padR} y1={gy} y2={gy} stroke="var(--line)" strokeWidth="1" />)}
      <polygon points={areaPoints} fill="url(#revFill)" />
      <polyline points={linePoints} fill="none" stroke="var(--teal-700)" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
      {data.map((d, i) => <circle key={d.month} cx={x(i)} cy={y(d.value)} r="3.5" fill="var(--teal-800)" />)}
      {data.map((d, i) => (
        <text key={d.month} x={x(i)} y={height - 10} textAnchor="middle" fontSize="11" fill="var(--ink-faint)">{d.month}</text>
      ))}
      <text x={padL} y={padT - 6} fontSize="11" fill="var(--ink-faint)">{formatRWF(max)}</text>
    </svg>
  );
}

function RevenueDashboard({ onSignOut }) {
  const first = REVENUE_HISTORY[0].value;
  const last = REVENUE_HISTORY[REVENUE_HISTORY.length - 1].value;
  const growth = Math.round(((last - first) / first) * 100);
  const total = REVENUE_HISTORY.reduce((sum, d) => sum + d.value, 0);
  const avgMonthly = Math.round(total / REVENUE_HISTORY.length);

  const [cases, setCases] = useState(null);
  const [loadError, setLoadError] = useState('');

  useEffect(() => {
    let cancelled = false;
    sb.from('cases')
      .select('reference, full_name, service, province, district, status, submitted_at')
      .order('submitted_at', { ascending: false })
      .limit(200)
      .then(({ data, error }) => {
        if (cancelled) return;
        if (error) setLoadError(error.message || 'Could not load cases.');
        else setCases(data || []);
      });
    return () => { cancelled = true; };
  }, []);

  const now = new Date();
  const casesThisMonth = cases ? cases.filter((c) => {
    const d = new Date(c.submitted_at);
    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  }).length : null;

  const byService = {};
  (cases || []).forEach((c) => { byService[c.service] = (byService[c.service] || 0) + 1; });
  const topServices = Object.entries(byService).sort((a, b) => b[1] - a[1]).slice(0, 5);

  return (
    <main className="dash-page">
      <div className="dash-header">
        <div className="dash-header-top">
          <div className="section-label">OWNER DASHBOARD</div>
          <button type="button" className="signout-button" onClick={onSignOut}>Sign out</button>
        </div>
        <h2>How the platform earns, and how it's growing</h2>
        <p className="section-description">
          Figures below are illustrative projections, not real transactions — no payment system is
          connected yet. They're here to show the intended business model and what growth could look
          like once monetization is switched on.
        </p>
      </div>

      <div className="dash-stats">
        <div className="stat-card">
          <span>This month (Dec)</span>
          <strong>{formatRWF(last)}</strong>
        </div>
        <div className="stat-card highlight">
          <span>Growth over 12 months</span>
          <strong>+{growth}%</strong>
        </div>
        <div className="stat-card">
          <span>Average monthly revenue</span>
          <strong>{formatRWF(avgMonthly)}</strong>
        </div>
        <div className="stat-card">
          <span>Projected annual total</span>
          <strong>{formatRWF(total)}</strong>
        </div>
      </div>

      <div className="chart-card">
        <h3>Monthly revenue trend</h3>
        <RevenueChart data={REVENUE_HISTORY} />
      </div>

      <div className="dash-section-label">LIVE ACTIVITY</div>
      <h3 className="dash-subheading">Real case submissions</h3>
      <p className="section-description" style={{ marginBottom: 20 }}>
        This part is real — pulled straight from your Supabase <code>cases</code> table.
      </p>

      {loadError && (
        <p className="submit-error" style={{ marginBottom: 24 }}>
          Couldn't load cases: {loadError}. Make sure you've run the "authenticated can view cases"
          policy from the setup SQL.
        </p>
      )}

      {!loadError && (
        <>
          <div className="dash-stats" style={{ marginBottom: 30 }}>
            <div className="stat-card">
              <span>Total cases submitted</span>
              <strong>{cases === null ? '…' : cases.length}</strong>
            </div>
            <div className="stat-card highlight">
              <span>Submitted this month</span>
              <strong>{casesThisMonth === null ? '…' : casesThisMonth}</strong>
            </div>
            <div className="stat-card">
              <span>Top service</span>
              <strong className="small-strong">
                {topServices[0] ? (SERVICES.find((s) => s.id === topServices[0][0])?.title || topServices[0][0]) : '—'}
              </strong>
            </div>
            <div className="stat-card">
              <span>Under review</span>
              <strong>{cases === null ? '…' : cases.filter((c) => c.status === 'Under Review').length}</strong>
            </div>
          </div>

          <div className="chart-card">
            <h3>Recent submissions</h3>
            {cases === null && <p className="section-description">Loading…</p>}
            {cases && cases.length === 0 && <p className="section-description">No cases submitted yet.</p>}
            {cases && cases.length > 0 && (
              <div className="cases-table-wrap">
                <table className="cases-table">
                  <thead>
                    <tr><th>Reference</th><th>Applicant</th><th>Service</th><th>Location</th><th>Status</th><th>Submitted</th></tr>
                  </thead>
                  <tbody>
                    {cases.slice(0, 15).map((c) => {
                      const service = SERVICES.find((s) => s.id === c.service);
                      return (
                        <tr key={c.reference}>
                          <td>{c.reference}</td>
                          <td>{c.full_name}</td>
                          <td>{service ? service.title : c.service}</td>
                          <td>{[c.district, c.province].filter(Boolean).join(', ')}</td>
                          <td><span className="status-pill">{c.status}</span></td>
                          <td>{formatDate(c.submitted_at)}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </>
      )}

      <div className="dash-section-label">WHERE IT COMES FROM</div>
      <h3 className="dash-subheading">Revenue streams</h3>
      <div className="stream-grid">
        {REVENUE_STREAMS.map((s) => (
          <div className="stream-card" key={s.title}>
            <div className="stream-top">
              <span className="stream-icon">{s.icon}</span>
              <span className="stream-share">{s.share}%</span>
            </div>
            <h4>{s.title}</h4>
            <p>{s.desc}</p>
            <div className="stream-bar"><span style={{ width: `${s.share * 3}%` }}></span></div>
          </div>
        ))}
      </div>
    </main>
  );
}

/* ---------------- App shell ---------------- */

function App() {
  const [view, setView] = useState('home');
  const [session, setSession] = useState(undefined); // undefined = checking, null = signed out
  const [profile, setProfile] = useState(null);

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session ?? null));
    const { data: sub } = sb.auth.onAuthStateChange((_event, sess) => setSession(sess ?? null));
    return () => sub.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (!session) { setProfile(null); return; }
    let cancelled = false;
    fetchProfile(session.user.id)
      .then((p) => { if (!cancelled) setProfile(p); })
      .catch(() => { if (!cancelled) setProfile(null); });
    return () => { cancelled = true; };
  }, [session]);

  function navigate(next) {
    setView(next);
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  async function signOutUser() {
    await sb.auth.signOut();
    navigate('home');
  }

  let page;
  if (view === 'home') page = <Home onNavigate={navigate} />;
  else if (view === 'wizard') page = <AuthGate session={session} profile={profile}><SubmitCase onNavigate={navigate} /></AuthGate>;
  else if (view === 'account') page = session
    ? <main className="wizard-page"><div className="wizard-card login-card" style={{ textAlign: 'center' }}><h2>You're signed in</h2><p className="step-intro">{session.user.email || session.user.phone}</p><button type="button" className="btn-secondary" onClick={signOutUser}>Sign out</button></div></main>
    : <AuthForm />;
  else page = <AuthGate session={session} profile={profile} requireAdmin><RevenueDashboard onSignOut={signOutUser} /></AuthGate>;

  return (
    <div className="app-wrap">
      <Navbar onNavigate={navigate} session={session} onSignOut={signOutUser} />
      {page}
      <Footer onNavigate={navigate} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
